# ChainPulse Frontend - Production Nginx Configuration
# Enforces SPA routing, security headers, gzip compression, and caching

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://unpkg.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://*;" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # SPA Routing: all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health Check
    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
